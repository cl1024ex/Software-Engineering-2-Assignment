{% extends "layout.html" %}

{% block content %}
<main class="container">
    <header class="header">
        <h1>Car Price Predictor</h1>
        <p>Enter the car's details to receive an estimated price.</p>
    </header>

    {% if input_error %}
        <p role="alert">{{ input_error }}</p>
    {% endif %}

    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="brand">Brand</label>
                <select id="brand" name="brand" required>
                    <option value="">Select a brand</option>
                    {% for brand in brands %}
                        <option value="{{ brand }}">{{ brand }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="model">Model</label>
                <input id="model" name="model" type="text" placeholder="e.g. Focus" required>
            </div>

            <div class="form-group">
                <label for="year">Year</label>
                <input id="year" name="year" type="number" min="{{ min_year }}" max="{{ max_year }}" step="1" required>
            </div>

            <div class="form-group">
                <label for="transmission">Transmission</label>
                <input id="transmission" name="transmission" type="text" placeholder="e.g. Manual">
            </div>

            <div class="form-group">
                <label for="mileage">Mileage</label>
                <input id="mileage" name="mileage" type="number" min="0" step="1" placeholder="e.g. 25000">
            </div>

            <div class="form-group">
                <label for="fuel_type">Fuel type</label>
                <input id="fuel_type" name="fuel_type" type="text" placeholder="e.g. Petrol">
            </div>

            <div class="form-group">
                <label for="tax">Tax</label>
                <input id="tax" name="tax" type="number" min="0" step="any">
            </div>

            <div class="form-group">
                <label for="mpg">MPG</label>
                <input id="mpg" name="mpg" type="number" min="0" step="any">
            </div>

            <div class="form-group">
                <label for="engine_size">Engine size</label>
                <input id="engine_size" name="engine_size" type="number" min="0" step="any" placeholder="e.g. 1.6">
            </div>
        </div>

        <button type="submit">Predict car price</button>
    </form>
</main>
{% endblock %}
